name: Refresh public data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-public-data.yml
      - tools/sync-live-data.mjs
  schedule:
    - cron: '47,53,58 5 * * *'
    - cron: '6,14,23,33,44,54 6-9 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and validate current data
        run: node tools/sync-live-data.mjs --wait-for-reset --retry

      - name: Publish changed data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/live)" ]]; then
            echo "No data changes to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git commit -m "Refresh public data"
          git pull --rebase origin main
          git push origin HEAD:main
